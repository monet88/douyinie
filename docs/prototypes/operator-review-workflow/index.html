<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PROTOTYPE — Douyinie Operator Review</title>
<!-- THROWAWAY PROTOTYPE: Three operator-review UI variants, switchable via ?variant=A|B|C. -->
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8ecf1;background:#0a0c10;--panel:#12161d;--panel2:#171d26;--line:#29313d;--muted:#9099a7;--ok:#62d49f;--warn:#f3c969;--bad:#ff7d7d;--accent:#78a7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a0c10;color:#e8ecf1}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:74px}
.topbar{height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#0e1117;position:sticky;top:0;z-index:20}.brand{font-weight:760}.badge{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.spacer{flex:1}.mode{display:flex;background:#090b0f;border:1px solid var(--line);border-radius:9px;padding:3px}.mode button{border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:6px}.mode button.active{background:#202837;color:#fff}
.progress{font-size:12px;color:var(--muted)}.progress b{color:#fff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:#1b222c;color:#e8ecf1;border-radius:8px;padding:8px 11px}.btn.primary{background:#2e63c7;border-color:#3f73d6}.btn.good{background:#153b2d;border-color:#286548}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
.flag{font-size:11px;font-weight:700;padding:4px 7px;border-radius:999px}.flag.low{background:#402326;color:#ffb0b0}.flag.timing{background:#46391f;color:#ffe09a}.flag.ok{background:#173c2d;color:#8ce8ba}
.video{background:linear-gradient(145deg,#242b36,#11151c);border:1px solid #333d4b;border-radius:12px;aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden}.video:before{content:"SOURCE VIDEO";letter-spacing:.16em;color:#7d8794;font-size:12px}.caption{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);background:#050608d9;padding:6px 10px;border-radius:5px;font-weight:700;white-space:nowrap}.playhead{position:absolute;bottom:0;left:0;width:64%;height:3px;background:var(--accent)}
textarea{width:100%;min-height:84px;resize:vertical;background:#0d1117;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}select,input[type=range]{background:#0d1117;color:#fff;border:1px solid var(--line);border-radius:8px;padding:7px}.kv{display:grid;grid-template-columns:110px 1fr;gap:7px;font-size:12px}.kv span:nth-child(odd){color:var(--muted)}
.issue{padding:10px;border:1px solid var(--line);border-radius:9px;background:#10151c;cursor:pointer}.issue.selected{outline:2px solid #3f73d6}.issue-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.source-target{display:grid;grid-template-columns:1fr 1fr;gap:10px}.textcard{padding:10px;background:#0d1117;border:1px solid var(--line);border-radius:9px}.textcard h4{margin:0 0 7px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.state-dump{position:fixed;right:14px;bottom:72px;z-index:40;width:min(420px,calc(100vw - 28px));background:#080a0e;border:1px solid #36404d;border-radius:10px;font-size:11px}.state-dump summary{padding:8px 10px;cursor:pointer}.state-dump pre{white-space:pre-wrap;max-height:260px;overflow:auto;padding:0 10px 10px;color:#9fb3c8}
.switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:8px;padding:7px;background:#f4f6f8;color:#111;border-radius:999px;box-shadow:0 8px 30px #0009}.switcher button{width:34px;height:34px;border:0;border-radius:50%;background:#dfe5ec}.switcher .label{min-width:190px;text-align:center;font-size:12px;font-weight:700}
</style><style>
/* Variant A: dense review queue + detail inspector */
.va{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:12px;padding:12px}.va .queue,.va .inspector{padding:12px;height:calc(100vh - 96px);overflow:auto}.va .canvas{display:grid;grid-template-rows:auto auto 1fr;gap:12px}.va h3,.vb h3,.vc h3{margin:0}.queue-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.stagebar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.stage{padding:8px;border-radius:8px;background:#141a22;border:1px solid var(--line);font-size:11px;text-align:center}.stage.done{border-color:#2d644e;color:#8ce8ba}.stage.warn{border-color:#6a5428;color:#ffe09a}
/* Variant B: video + timeline first, drawer for correction */
.vb{padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}.vb .main{display:flex;flex-direction:column;gap:12px}.vb .drawer{padding:14px;height:calc(100vh - 96px);overflow:auto}.timeline{padding:12px}.timeline-track{height:88px;position:relative;background:#0b0f14;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:10px}.block{position:absolute;top:13px;height:62px;border-radius:7px;padding:6px;font-size:10px;border:1px solid #385278;background:#1b2f4b;overflow:hidden}.block.problem{border-color:#9a6732;background:#422d1d}.block.active{outline:2px solid #7eaeff}.scrub{height:3px;background:#78a7ff;position:absolute;top:0;bottom:0;left:63%;width:2px;height:100%}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.thumb{aspect-ratio:16/9;border-radius:6px;background:linear-gradient(140deg,#343b49,#151922);display:grid;place-items:end center;padding:5px;font-size:10px;color:#aeb6c0}
/* Variant C: guided issue-by-issue review */
.vc{max-width:1060px;margin:auto;padding:18px}.steps{display:flex;gap:8px;margin:12px 0 18px}.step{flex:1;padding:9px;border-bottom:3px solid #27303b;color:var(--muted);font-size:12px}.step.active{border-color:#78a7ff;color:#fff}.step.done{border-color:#4aa97a;color:#92dfb8}.guided{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:14px}.guided .review-card{padding:16px}.issue-count{font-size:13px;color:var(--muted)}.focus-problem{padding:12px;border-radius:10px;background:#271d13;border:1px solid #6f552c}.before-after{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview-frame{aspect-ratio:16/7;border-radius:8px;background:#161b22;display:flex;align-items:flex-end;justify-content:center;padding:20px 10px}.preview-frame span{background:#040506df;padding:5px 8px;border-radius:4px}.guided-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.timing-wrap{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0d1117}.timing-bars{position:relative;height:24px;margin-top:7px}.timing-budget,.timing-measured{position:absolute;left:0;height:7px;border-radius:999px}.timing-budget{top:2px;background:#344255}.timing-measured{top:14px;background:#a36f36}.timing-measured.ok{background:#286548}.queue-empty{padding:16px;border:1px dashed #3a4655;border-radius:9px;text-align:center;color:#9fb3c8}.decision-note{padding:9px;border-radius:8px;background:#111923;border:1px solid #2b3b50;font-size:12px}
@media(max-width:900px){.va,.vb,.guided{grid-template-columns:1fr}.va .queue,.va .inspector,.vb .drawer{height:auto}.source-target,.before-after{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<details class="state-dump"><summary>Prototype state</summary><pre id="stateDump"></pre></details>
<div class="switcher"><button id="prevVariant" aria-label="Previous variant">←</button><div class="label" id="variantLabel"></div><button id="nextVariant" aria-label="Next variant">→</button></div>
<script>const variants={A:'Queue + Inspector',B:'Timeline-first',C:'Guided Review'};
const state={
 mode:'Auto',selected:'S07',finalRenderState:'blocked',
 stages:[['Acquire','done'],['Analyze','done'],['Translate','done'],['Dub','warn'],['Subtitles','warn'],['Render','']],
 segments:[
  {id:'S04',t:'00:08.2–00:11.4',speaker:'Host',voice:'VN Warm 02',confidence:.94,delta:.08,source:'这个方法其实很简单。',target:'Cách này thực ra rất đơn giản.',flag:'ok',approved:true,needsRerun:false,resolution:'auto_pass',invalidates:[],attempts:1},
  {id:'S07',t:'00:18.6–00:22.1',speaker:'Host',voice:'VN Warm 02',confidence:.61,delta:1.12,source:'重点是你一定要把前两步做对。',target:'Điểm quan trọng là bạn nhất định phải làm đúng hai bước đầu tiên.',flag:'timing',approved:false,needsRerun:false,resolution:'review_required',invalidates:[],attempts:2},
  {id:'S11',t:'00:31.0–00:34.8',speaker:'Guest',voice:'VN Clear 05',confidence:.48,delta:.24,source:'我第一次也完全没听懂。',target:'Lần đầu tôi cũng hoàn toàn không hiểu.',flag:'low',approved:false,needsRerun:false,resolution:'review_required',invalidates:[],attempts:1}
 ]
};
function seg(){return state.segments.find(x=>x.id===state.selected)||state.segments[0]}
function openReviewItems(){return state.segments.filter(x=>!x.approved&&(x.flag!=='ok'||x.needsRerun))}
function durationSeconds(s){const parse=x=>{const [m,sec]=x.split(':').map(Number);return m*60+sec};const [a,b]=s.t.split('–');return Math.max(.1,parse(b)-parse(a))}
function flags(s){let label,cls=s.flag;if(s.needsRerun){label='Needs rerun';cls='timing'}else if(s.flag==='timing')label=`+${s.delta.toFixed(2)}s over`;else if(s.flag==='low')label=`${Math.round(s.confidence*100)}% confidence`;else label='OK';return `<span class="flag ${cls}">${label}</span>`}
function timingBar(s){const budget=durationSeconds(s),measured=Math.max(.1,budget+s.delta),scale=Math.max(budget,measured),budgetPct=budget/scale*100,measuredPct=measured/scale*100;return `<div class="timing-wrap"><div class="row"><b>Timing budget</b><span class="spacer"></span><span class="small muted">${budget.toFixed(2)}s budget · ${measured.toFixed(2)}s measured</span></div><div class="timing-bars"><div class="timing-budget" style="width:${budgetPct}%"></div><div class="timing-measured ${s.delta<=.35?'ok':''}" style="width:${measuredPct}%"></div></div></div>`}
function modeControl(){return `<div class="mode"><button data-mode="Auto" class="${state.mode==='Auto'?'active':''}">Auto</button><button data-mode="Review" class="${state.mode==='Review'?'active':''}">Review</button></div>`}
function syncFinalRender(){const open=openReviewItems().length;if(open){state.finalRenderState='blocked'}else if(state.mode==='Auto'){state.finalRenderState='complete'}else if(state.finalRenderState!=='complete'){state.finalRenderState='ready'}const renderStage=state.stages.find(x=>x[0]==='Render');renderStage[1]=state.finalRenderState==='complete'?'done':state.finalRenderState==='ready'?'warn':''}
function header(){const open=openReviewItems().length;let label,disabled=true,cls='btn';if(state.finalRenderState==='complete'){label='Final render complete ✓';cls+=' good'}else if(state.mode==='Auto'){label=`Auto render waits on ${open} exception${open===1?'':'s'}`}else if(state.finalRenderState==='ready'){label='Start final render';disabled=false;cls+=' primary'}else{label=`Resolve ${open} review item${open===1?'':'s'}`};return `<div class="topbar"><div class="brand">Douyinie <span class="badge">PROTOTYPE</span></div><div class="progress">Run <b>DY-2026-0819-014</b> · VI · Hybrid</div><div class="spacer"></div>${modeControl()}<button class="${cls}" data-action="final" ${disabled?'disabled':''}>${label}</button></div>`}
function stageBar(){return `<div class="stagebar">${state.stages.map(([n,c])=>`<div class="stage ${c}">${n}${c==='done'?' ✓':c==='warn'?' !':''}</div>`).join('')}</div>`}
function issueItem(s){return `<div class="issue ${state.selected===s.id?'selected':''}" data-select="${s.id}"><div class="issue-head"><b>${s.id}</b>${flags(s)}</div><div class="small muted">${s.t} · ${s.speaker}</div><div class="small" style="margin-top:5px">${s.target}</div></div>`}
function sourceTarget(s,editable=true){return `<div class="source-target"><div class="textcard"><h4>Chinese source</h4><div>${s.source}</div></div><div class="textcard"><h4>Target speech copy</h4>${editable?`<textarea data-target-text="${s.id}">${s.target}</textarea>`:`<div>${s.target}</div>`}</div></div>`}
function controls(s){const override=!s.approved&&(s.flag!=='ok'||s.needsRerun);return `<div class="col"><div class="kv"><span>Speaker</span><b>${s.speaker}</b><span>Voice assignment</span><select data-voice="${s.id}"><option>${s.voice}</option><option>VN Warm 02</option><option>VN Clear 05</option><option>EN Natural 03</option></select><span>Block budget</span><b>${s.t}</b><span>Measured overrun</span><b>${s.delta>0?'+'+s.delta.toFixed(2)+'s':'0s'}</b><span>Attempts</span><b>${s.attempts}</b><span>Resolution</span><b>${s.resolution}</b></div>${timingBar(s)}${s.invalidates.length?`<div class="decision-note">Pending invalidation: ${s.invalidates.join(' → ')}</div>`:''}<div class="row"><button class="btn" data-action="regen" data-id="${s.id}">Regenerate dub</button><button class="btn good" data-action="approve" data-id="${s.id}">${s.approved?'Approved ✓':override?'Override & approve':'Approve segment'}</button></div></div>`}
function variantA(){const s=seg(),open=openReviewItems();const queue=open.length?open.map(issueItem).join(''):`<div class="queue-empty"><b>Queue clear</b><div class="small" style="margin-top:6px">${state.mode==='Auto'?'No exception requires attention. Final render proceeds automatically.':'All exceptions are resolved. Final render is ready.'}</div></div>`;return `${header()}<main class="va">
 <aside class="panel queue"><div class="row"><h3>Exception queue</h3><span class="spacer"></span><span class="badge">${open.length} open</span></div><p class="small muted">Auto is the default. Only unresolved quality or timing exceptions interrupt the run.</p><div class="queue-list">${queue}</div></aside>
 <section class="canvas"><div class="panel" style="padding:10px">${stageBar()}</div><div class="video"><div class="caption">${s.source}</div><div class="playhead"></div></div><div class="panel" style="padding:12px"><div class="row"><b>${s.id} · ${s.t}</b>${flags(s)}<span class="spacer"></span><button class="btn ghost" data-action="rerun-subtitles" data-id="${s.id}">Re-run subtitles</button></div><div style="margin-top:10px">${sourceTarget(s)}</div></div></section>
 <aside class="panel inspector"><h3>Correction inspector</h3><p class="small muted">Edit the smallest artifact, then rerun only dependent output. Timeline context is supporting evidence, not the primary workflow.</p>${controls(s)}<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h4>Burned-in subtitle check</h4><div class="before-after"><div class="preview-frame"><span>${s.source}</span></div><div class="preview-frame"><span>${s.target}</span></div></div></aside>
 </main>`}
function variantB(){const s=seg();return `${header()}<main class="vb"><section class="main"><div class="video" style="max-height:55vh"><div class="caption">${s.target}</div><div class="playhead"></div></div><div class="panel timeline"><div class="row"><h3>Speech-block timeline</h3><span class="spacer"></span><span class="small muted">Click a flagged block to inspect</span></div><div class="timeline-track">${state.segments.map((x,i)=>`<div class="block ${x.flag!=='ok'||x.needsRerun?'problem':''} ${x.id===s.id?'active':''}" data-select="${x.id}" style="left:${8+i*29}%;width:${18+i*2}%"><b>${x.id}</b><br>${x.speaker}<br>${x.delta?`Δ ${x.delta.toFixed(2)}s`:''}</div>`).join('')}<div class="scrub"></div></div></div><div class="thumbs">${['00:12','00:18','00:22','00:31','00:35'].map(t=>`<div class="thumb">${t}</div>`).join('')}</div></section>
 <aside class="panel drawer"><div class="row"><h3>${s.id} timing drawer</h3><span class="spacer"></span>${flags(s)}</div><p class="small muted">Supporting timeline context only; correction ownership remains with the exception queue.</p>${sourceTarget(s)}<div style="margin-top:12px">${controls(s)}</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="row"><button class="btn" data-action="regen" data-id="${s.id}">Regenerate & measure</button><button class="btn ghost" data-action="rerun-subtitles" data-id="${s.id}">Refresh subtitle preview</button></div></aside></main>`}
function variantC(){const s=seg(),open=openReviewItems(),idx=state.segments.findIndex(x=>x.id===s.id);return `${header()}<main class="vc"><div class="steps"><div class="step done">1 · Source analyzed</div><div class="step active">2 · Review ${open.length} issues</div><div class="step">3 · Final preview</div><div class="step ${state.finalRenderState==='complete'?'done':''}">4 · Render</div></div><div class="guided"><section class="panel review-card"><div class="row"><div><div class="issue-count">Segment ${idx+1} of ${state.segments.length}</div><h3>${s.id} · ${s.speaker}</h3></div><span class="spacer"></span>${flags(s)}</div><div class="focus-problem" style="margin:12px 0"><b>${s.needsRerun?'Edited artifact needs targeted rerun':s.flag==='timing'?'Speech exceeds its timing budget':s.flag==='low'?'ASR/OCR confidence needs human check':'No exception'}</b><div class="small muted" style="margin-top:4px">Auto mode pauses only for unresolved exceptions; manual approval is an explicit override.</div></div>${sourceTarget(s)}<div style="margin-top:12px">${controls(s)}</div><div class="guided-nav"><button class="btn" data-action="prev-issue">← Previous</button><button class="btn good" data-action="approve-next">Override & next →</button></div></section><aside class="col"><div class="panel" style="padding:12px"><h3>Before / after</h3><div class="before-after" style="margin-top:10px"><div><div class="small muted">Source burned-in</div><div class="preview-frame"><span>${s.source}</span></div></div><div><div class="small muted">Localized preview</div><div class="preview-frame"><span>${s.target}</span></div></div></div></div><div class="panel" style="padding:12px"><h3>Run progress</h3><div style="margin-top:10px">${stageBar()}</div><p class="small muted">Targeted reruns reopen only dependent review items; committed source artifacts stay reusable.</p></div></aside></div></main>`}
function currentVariant(){const p=new URLSearchParams(location.search),v=(p.get('variant')||'A').toUpperCase();return variants[v]?v:'A'}
function syncSelection(){const open=openReviewItems();if(open.length&&!open.some(x=>x.id===state.selected)&&state.mode==='Auto')state.selected=open[0].id}
function render(){syncFinalRender();const v=currentVariant();document.getElementById('root').innerHTML=v==='A'?variantA():v==='B'?variantB():variantC();document.getElementById('variantLabel').textContent=`${v} — ${variants[v]}`;document.getElementById('stateDump').textContent=JSON.stringify(state,null,2);bind()}
function markDirty(s,kind,invalidates){s.approved=false;s.needsRerun=true;s.resolution=`dirty_${kind}`;s.invalidates=invalidates;state.finalRenderState='blocked'}
function bind(){document.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{state.selected=el.dataset.select;render()});document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{state.mode=el.dataset.mode;render()});document.querySelectorAll('[data-target-text]').forEach(el=>el.onchange=()=>{const s=state.segments.find(x=>x.id===el.dataset.targetText);s.target=el.value;markDirty(s,'target_text',['TTS Attempt','DubSegment','DubMix','LocalizedSubtitleTrack','FinalRender']);render()});document.querySelectorAll('[data-voice]').forEach(el=>el.onchange=()=>{const s=state.segments.find(x=>x.id===el.dataset.voice);s.voice=el.value;markDirty(s,'voice_assignment',['TTS Attempt','DubSegment','DubMix','FinalRender']);render()});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action,el.dataset.id))}
function action(name,id){const s=id?state.segments.find(x=>x.id===id):seg();if(name==='regen'){s.attempts++;s.delta=Math.max(0,s.delta-.48);s.needsRerun=false;s.invalidates=[];if(s.delta<.35&&s.confidence>=.65){s.flag='ok';s.approved=true;s.resolution='auto_resolved'}else{if(s.delta<.35&&s.confidence<.65)s.flag='low';s.approved=false;s.resolution='review_required'}}if(name==='approve'){s.approved=true;s.needsRerun=false;s.invalidates=[];s.resolution=(s.flag!=='ok')?'manual_override':'manual_approve'}if(name==='rerun-subtitles'){s.attempts++;s.needsRerun=false;s.invalidates=[];s.resolution=s.flag==='ok'?'auto_resolved':'review_required';if(s.flag==='ok')s.approved=true}if(name==='final'&&state.mode==='Review'&&state.finalRenderState==='ready'){state.finalRenderState='complete'}if(name==='prev-issue'){const i=state.segments.findIndex(x=>x.id===state.selected);state.selected=state.segments[(i-1+state.segments.length)%state.segments.length].id}if(name==='approve-next'){s.approved=true;s.needsRerun=false;s.invalidates=[];s.resolution='manual_override';const open=openReviewItems();state.selected=open[0]?.id||s.id}syncSelection();render()}
function setVariant(v){const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState({},'',u);render()}
function cycle(dir){const keys=Object.keys(variants),i=keys.indexOf(currentVariant());setVariant(keys[(i+dir+keys.length)%keys.length])}
document.getElementById('prevVariant').onclick=()=>cycle(-1);document.getElementById('nextVariant').onclick=()=>cycle(1);window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});window.addEventListener('popstate',render);render();
</script>
</body>
</html>
